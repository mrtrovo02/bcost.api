services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bcost-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bcost_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bcost}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bcost} -d ${POSTGRES_DB:-bcost}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcost-local

  redis:
    image: redis:7-alpine
    container_name: bcost-redis-local
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-bcost_redis_dev}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-bcost_redis_dev}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcost-local

volumes:
  postgres_data:
  redis_data:

networks:
  bcost-local:
    driver: bridge
