name: bCost API CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bcost-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release Gates, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://bcost_app:bcost@localhost:5432/bcost
      DIRECT_URL: postgresql://bcost:bcost@localhost:5432/bcost
      JWT_SECRET: bcost-ci-release-secret-with-more-than-forty-eight-characters
      JWT_EXPIRES_IN: 15m
      FRONTEND_BASE_URL: https://app.bcost.com.br
      PUBLIC_APP_URL: https://app.bcost.com.br
      CORS_ORIGINS: https://bcost.com.br,https://www.bcost.com.br,https://app.bcost.com.br
      ENABLE_DEMO_FALLBACK: "false"
      ALLOW_DEMO_SESSION: "false"
      ALLOW_SETUP_ADMIN: "false"
      ENABLE_SWAGGER: "false"
      RELEASE_STAGE: beta
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_PRO: ""
      STRIPE_PRICE_ENTERPRISE: ""
      METRICS_API_KEY: bcost-ci-metrics-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies report
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Block unsafe committed configuration
        run: npm run security:scan

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Validate production environment contract
        run: npm run release:check

      - name: Run release gate tests
        run: npm test -- --runInBand src/release/validate-production-env.spec.ts src/release/provision-production-company.spec.ts

      - name: Run auth/session tests
        run: npm test -- --runInBand src/auth/guards/jwt-auth.guard.spec.ts src/auth/guards/tenant-context.guard.spec.ts src/auth/auth.controller.security.spec.ts

      - name: Run tenant and business security tests
        run: npm run test:security

      - name: Run RLS policy contract tests
        run: npm test -- --runInBand src/database/prisma.rls.spec.ts

      - name: Run tax scenario calculation tests
        run: npm run test:tax-scenarios

      - name: Run observability tests
        run: npm run test:observability

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  rls-integration:
    name: PostgreSQL RLS Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bcost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bcost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bcost
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bcost
      RLS_INTEGRATION_DATABASE_URL: postgresql://bcost_app:bcost@localhost:5432/bcost
      RLS_TEST_COMPANY_A: 11111111-1111-4111-8111-111111111111
      RLS_TEST_COMPANY_B: 22222222-2222-4222-8222-222222222222

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Deploy migrations
        run: npm run prisma:migrate

      - name: Prepare runtime RLS role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d bcost <<'SQL'
          ALTER ROLE bcost_app WITH PASSWORD 'bcost' NOBYPASSRLS;
          SQL

      - name: Seed RLS companies
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d bcost <<'SQL'
          INSERT INTO "companies" ("id", "cnpj", "name", "taxRegime", "anexo", "active", "planLevel", "createdAt", "updatedAt")
          VALUES
            ('11111111-1111-4111-8111-111111111111', '11111111000111', 'RLS Company A', 'SIMPLES_NACIONAL', 3, true, 'FREE', now(), now()),
            ('22222222-2222-4222-8222-222222222222', '22222222000122', 'RLS Company B', 'SIMPLES_NACIONAL', 3, true, 'FREE', now(), now())
          ON CONFLICT ("id") DO NOTHING;
          SQL

      - name: Run real PostgreSQL RLS integration test
        run: npm run test:rls
