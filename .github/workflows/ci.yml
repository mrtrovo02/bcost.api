name: CI Professional Workflow
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Versão estável em 2026
      - run: npm install
      - run: npm run lint
      - run: npm run test # Garante que nada quebrou