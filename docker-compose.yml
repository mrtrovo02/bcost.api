services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcost-app
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bcost-network

  redis:
    image: redis:alpine
    container_name: bcost-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bcost-network

volumes:
  redis_data:

networks:
  bcost-network:
    driver: bridge
